openapi: 3.1.0
info:
  title: Smart Health Monitoring System API Contract
  version: 1.0.0
  description: >-
    Shared contract for the demo simulator and the backend. All sample health data
    generated by the simulator is synthetic and must remain marked as simulated.
servers:
  - url: http://localhost:8000
    description: Backend API (local development; use HTTPS when deployed)
tags:
  - name: Auth
  - name: Patients
  - name: Readings
  - name: Alerts
  - name: Demo Control
  - name: Simulator Internal
security: []
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in a seeded or registered user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, user]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: Bearer }
                  expires_in: { type: integer }
                  user:
                    type: object
                    required: [user_id, email, role]
                    properties:
                      user_id: { type: string }
                      email: { type: string }
                      role: { type: string, enum: [PATIENT, DOCTOR, ADMIN] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Too many login attempts }
  /api/v1/me:
    get:
      tags: [Auth]
      summary: Return the current user's identity and role
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  email: { type: string, format: email }
                  role: { type: string, enum: [PATIENT, DOCTOR, ADMIN] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/patients:
    get:
      tags: [Patients]
      summary: List patients visible to the current doctor/admin
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 120 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Authorized patient list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [patient_id, full_name]
                      properties:
                        patient_id: { type: string }
                        full_name: { type: string }
                        last_measured_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/patients/{patient_id}/vitals/latest:
    get:
      tags: [Readings]
      summary: Return latest available measurement for each metric
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: Latest measurements with freshness metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  patient_id: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VitalReading' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Patient not found }
  /api/v1/patients/{patient_id}/vitals:
    get:
      tags: [Readings]
      summary: Retrieve filtered vital-sign history
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - in: query
          name: metric_code
          schema: { $ref: '#/components/schemas/MetricCode' }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
      responses:
        '200':
          description: Readings ordered by measured_at
          content:
            application/json:
              schema:
                type: object
                properties:
                  patient_id: { type: string }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VitalReading' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/patients/{patient_id}/alerts:
    get:
      tags: [Alerts]
      summary: Retrieve alerts for a patient
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - in: query
          name: status
          schema: { type: string, enum: [NEW, ACKNOWLEDGED, RESOLVED] }
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/alerts/{alert_id}/acknowledge:
    post:
      tags: [Alerts]
      summary: Acknowledge an alert
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: alert_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Alert acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Alert not found }
        '409': { description: Alert is already resolved or cannot be acknowledged }
  /api/v1/alerts/{alert_id}/resolve:
    post:
      tags: [Alerts]
      summary: Resolve an alert
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: alert_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Alert resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Alert not found }
  /api/v1/ingest/readings:
    post:
      tags: [Readings]
      summary: Ingest a simulator event (service-to-service only)
      security: [{ simulatorKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadingEvent' }
            examples:
              normalDemoEvent:
                value:
                  source_event_id: demo-event-000001
                  patient_id: demo-patient-001
                  source: demo-simulator
                  is_simulated: true
                  measured_at: '2026-10-09T10:30:00Z'
                  measurements:
                    - { metric_code: heart_rate, value: 82, unit: bpm }
                    - { metric_code: spo2, value: 98, unit: '%' }
                    - { metric_code: temperature, value: 36.8, unit: degC }
                    - { metric_code: respiratory_rate, value: 16, unit: breaths/min }
                    - { metric_code: bp_systolic, value: 118, unit: mmHg }
                    - { metric_code: bp_diastolic, value: 76, unit: mmHg }
      responses:
        '202':
          description: Accepted or safely identified as duplicate
          content:
            application/json:
              schema:
                type: object
                required: [source_event_id, status, is_simulated, stored_measurements, duplicate]
                properties:
                  source_event_id: { type: string }
                  status: { type: string, enum: [accepted, duplicate] }
                  is_simulated: { type: boolean, const: true }
                  stored_measurements: { type: integer, minimum: 0 }
                  duplicate: { type: boolean }
        '400': { description: Invalid schema, metric or unit }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Patient not found }
  /api/v1/demo/runs:
    post:
      tags: [Demo Control]
      summary: Start a simulator run (backend proxies to simulator)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
      responses:
        '201':
          description: Run started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/demo/runs/{run_id}/stop:
    post:
      tags: [Demo Control]
      summary: Stop a simulator run
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/demo/runs/{run_id}/scenario:
    patch:
      tags: [Demo Control]
      summary: Change an active run's scenario
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario: { $ref: '#/components/schemas/Scenario' }
      responses:
        '200':
          description: Scenario changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /internal/v1/runs:
    servers:
      - url: http://localhost:8010
        description: Private Demo Health API service (internal only)
    post:
      tags: [Simulator Internal]
      summary: Start a stream directly on the simulator service
      security: [{ simulatorKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRunRequest' }
      responses:
        '201':
          description: Run started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /internal/v1/runs/{run_id}/stop:
    servers:
      - url: http://localhost:8010
    post:
      tags: [Simulator Internal]
      summary: Stop a stream directly on the simulator service
      security: [{ simulatorKey: [] }]
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run stopped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
  /internal/v1/runs/{run_id}/scenario:
    servers:
      - url: http://localhost:8010
    patch:
      tags: [Simulator Internal]
      summary: Change simulator scenario
      security: [{ simulatorKey: [] }]
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario: { $ref: '#/components/schemas/Scenario' }
      responses:
        '200':
          description: Scenario updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
  /internal/v1/runs/{run_id}:
    servers:
      - url: http://localhost:8010
    get:
      tags: [Simulator Internal]
      summary: Inspect simulator run status
      security: [{ simulatorKey: [] }]
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Simulator status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoRun' }
  /health:
    servers:
      - url: http://localhost:8010
    get:
      tags: [Simulator Internal]
      summary: Simulator liveness check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    simulatorKey:
      type: apiKey
      in: header
      name: X-Simulator-Key
  parameters:
    PatientId:
      in: path
      name: patient_id
      required: true
      schema: { type: string }
  schemas:
    MetricCode:
      type: string
      enum: [heart_rate, spo2, temperature, respiratory_rate, bp_systolic, bp_diastolic]
    Measurement:
      type: object
      required: [metric_code, value, unit]
      properties:
        metric_code: { $ref: '#/components/schemas/MetricCode' }
        value: { type: number }
        unit: { type: string }
    ReadingEvent:
      type: object
      required: [source_event_id, patient_id, source, measured_at, measurements]
      properties:
        source_event_id: { type: string, minLength: 1, maxLength: 100 }
        patient_id: { type: string }
        source: { type: string, const: demo-simulator }
        is_simulated: { type: boolean, const: true, default: true }
        measured_at: { type: string, format: date-time, description: Must be ISO-8601 UTC for this project. }
        measurements:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/Measurement' }
    VitalReading:
      type: object
      required: [metric_code, value, unit, measured_at, received_at, is_simulated, freshness]
      properties:
        reading_id: { type: integer }
        metric_code: { $ref: '#/components/schemas/MetricCode' }
        value: { type: number }
        unit: { type: string }
        measured_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        source: { type: string }
        is_simulated: { type: boolean }
        quality_status: { type: string, enum: [valid, suspect, unavailable] }
        freshness: { type: string, enum: [current, stale, unavailable] }
    Alert:
      type: object
      properties:
        alert_id: { type: string }
        patient_id: { type: string }
        severity: { type: string, enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string, enum: [NEW, ACKNOWLEDGED, RESOLVED] }
        reason: { type: string }
        source: { type: string, enum: [RULE, ML, COMBINED, DATA_QUALITY] }
        is_simulated: { type: boolean }
        created_at: { type: string, format: date-time }
        acknowledged_at: { type: [string, 'null'], format: date-time }
    Scenario:
      type: string
      enum: [normal, single_anomaly, combined_anomaly, missing_data, stale_data, recovery]
    StartRunRequest:
      type: object
      required: [patient_id]
      properties:
        patient_id: { type: string }
        interval_seconds: { type: integer, minimum: 1, maximum: 60, default: 1 }
        scenario: { $ref: '#/components/schemas/Scenario', default: normal }
    DemoRun:
      type: object
      required: [run_id, patient_id, state, scenario, interval_seconds]
      properties:
        run_id: { type: string }
        patient_id: { type: string }
        state: { type: string, enum: [RUNNING, STOPPED, ERROR] }
        scenario: { $ref: '#/components/schemas/Scenario' }
        interval_seconds: { type: integer }
        last_generated_event_at: { type: [string, 'null'], format: date-time }
        failed_delivery_count: { type: integer, minimum: 0 }
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        request_id: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Role or patient-assignment check failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
