[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-health"
version = "0.1.0"
description = "Smart Health Monitoring System - Member 3 ML & Analytics Subsystem"
authors = [{ name = "Member 3" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["packages"]
testpaths = ["tests"]
